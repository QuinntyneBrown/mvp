name: Bug report
description: Report reproducible incorrect behavior in the CLI or freshly generated output.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve mvp. Search existing issues first. Do not report security vulnerabilities here; follow SECURITY.md.
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets, personal data, and proprietary source from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: input
    id: version
    attributes:
      label: mvp version or commit
      description: Paste `mvp --version` or the commit hash used to build the tool.
      placeholder: 2.0.0 or f602e5d
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system and relevant output from `dotnet --info`. Include Node.js only for frontend issues.
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and sanitized manifest
      description: Provide the exact command and the smallest manifest that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized errors or logs.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Build or install...
        2. Run...
        3. Inspect...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other useful context. Drag in only sanitized screenshots or files.
